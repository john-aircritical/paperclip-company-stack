services:
  stack:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PAPERCLIP_PORT:-9000}:9000"
    environment:
      # Paperclip
      PORT: "9000"
      PAPERCLIP_HOME: "/paperclip"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"

      # API keys
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in .env}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GITHUB_API_KEY: "${GITHUB_API_KEY:-}"

      # Admin account (created on first run)
      COMPANY_NAME: "${COMPANY_NAME:-AI Company}"
      ADMIN_NAME: "${ADMIN_NAME:-Admin}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@paperclip.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-paperclip-admin-2026}"

      # Internal
      HEADROOM_URL: "http://127.0.0.1:8787"
      RTK_DB_PATH: "/home/node/.local/share/rtk/history.db"

      # Identity
      USER_UID: "${USER_UID:-1000}"
      USER_GID: "${USER_GID:-1000}"
    volumes:
      - paperclip-data:/paperclip
      - claude-home:/home/node/.claude
      - ./CLAUDE.md:/app/CLAUDE.md:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${PORT:-9000}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  paperclip-data:
  claude-home:
